apiVersion: v1
kind: Service
metadata:
  name: books
  labels:
    {{- include "books-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.books.service.type }}
  selector:
    app: books
  ports:
    - port: {{ .Values.books.service.port }}
      targetPort: {{ .Values.books.serverPort }}
      {{- if eq .Values.books.service.type "LoadBalancer" }}
      nodePort: {{ .Values.books.service.nodePort }}
      {{- end }}